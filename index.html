<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওভারটাইম ট্র্যাকার - Hashi Akter</title>
    <!-- Firebase SDK (ব্যাকগ্রাউন্ডে সিঙ্কের জন্য) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- html2pdf.js (ডাইরেক্ট সুন্দর PDF ডাউনলোডের জন্য) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 850px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .profile-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FF6A88;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 106, 136, 0.3);
        }
        .profile-pic:hover {
            transform: scale(1.05);
        }
        input[type="file"] {
            display: none;
        }
        .title {
            color: #333;
            font-size: 26px;
            margin-top: 12px;
            font-weight: bold;
        }
        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-box {
            flex: 1;
            min-width: 150px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
        }
        input:focus {
            border-color: #FF6A88;
            box-shadow: 0 0 10px rgba(255, 106, 136, 0.3);
            background: #fff;
        }
        .btn-main {
            background: linear-gradient(to right, #FF6A88, #FF9A9E);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 106, 136, 0.4);
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 106, 136, 0.6);
        }
        .btn-cancel {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            display: none;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-action {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
            min-width: 160px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-excel { background-color: #21a366; }
        .btn-excel:hover { background-color: #177d4d; }
        .btn-pdf { background-color: #0284c7; }
        .btn-pdf:hover { background-color: #0369a1; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background: #FF6A88;
            color: white;
            font-size: 15px;
        }
        tr:hover {
            background-color: #fafafa;
        }
        .ot-highlight {
            color: #FF6A88;
            font-weight: bold;
            font-size: 16px;
        }
        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }
        .edit-btn:hover {
            background: #d97706;
        }
        .total-box {
            margin-top: 20px;
            background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1a4d2e;
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- প্রোফাইল সেকশন -->
        <div class="profile-section">
            <img src="https://ui-avatars.com/api/?name=Hashi+Akter&background=FF6A88&color=fff&size=128" alt="Profile" class="profile-pic" id="profileImage" onclick="document.getElementById('imageUpload').click()" title="ছবি পরিবর্তন করতে ক্লিক করুন">
            <input type="file" id="imageUpload" accept="image/*">
            <div class="title">ওভারটাইম হিসাব - Hashi Akter</div>
            <div class="subtitle">জেনারেল ডিউটি: সকাল ০৮:০০ - বিকেল ০৫:০০</div>
        </div>

        <!-- ইনপুট ফর্ম -->
        <div class="form-group">
            <div class="input-box">
                <label>তারিখ</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-box">
                <label>ইন টাইম</label>
                <input type="time" id="inTime" value="08:00">
            </div>
            <div class="input-box">
                <label>আউট টাইম</label>
                <input type="time" id="outTime" value="19:00">
            </div>
        </div>
        <button id="submitBtn" class="btn-main" onclick="handleSubmit()">হিসাব যোগ করুন</button>
        <button id="cancelBtn" class="btn-cancel" onclick="cancelEdit()">এডিট বাতিল করুন</button>

        <!-- ডাটা ডাউনলোড বাটনগুলো -->
        <div class="action-buttons">
            <button class="btn-action btn-excel" onclick="exportToCSV()">📊 Excel ডাউনলোড</button>
            <button class="btn-action btn-pdf" onclick="downloadPDF()">📄 PDF ডাউনলোড</button>
        </div>

        <!-- টেবিল লিস্ট -->
        <table>
            <thead>
                <tr>
                    <th>তারিখ</th>
                    <th>ইন টাইম</th>
                    <th>আউট টাইম</th>
                    <th>ওভারটাইম</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="recordTable">
            </tbody>
        </table>

        <!-- সর্বমোট হিসাব -->
        <div class="total-box">
            <span>সর্বমোট ওভারটাইম:</span>
            <span id="totalOtDisplay">০.০০ ঘণ্টা</span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        let db = null;
        let isFirebaseConnected = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseConnected = true;
            }
        } catch (e) {
            console.log("Firebase status error", e);
        }

        let records = [];
        let editingId = null;

        document.getElementById('dateInput').valueAsDate = new Date();
        const profileImage = document.getElementById('profileImage');

        window.addEventListener('load', () => {
            const savedImage = localStorage.getItem('userProfilePic');
            if (savedImage) profileImage.src = savedImage;

            if (isFirebaseConnected) {
                db.ref('otRecords').on('value', (snapshot) => {
                    const data = snapshot.val();
                    records = data ? Object.values(data) : [];
                    renderTable();
                });
            } else {
                records = JSON.parse(localStorage.getItem('otRecords')) || [];
                renderTable();
            }
        });

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    profileImage.src = event.target.result;
                    localStorage.setItem('userProfilePic', event.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        function formatTime(time) {
            if(!time) return "";
            let [h, m] = time.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }

        function handleSubmit() {
            const date = document.getElementById('dateInput').value;
            const inTime = document.getElementById('inTime').value;
            const outTime = document.getElementById('outTime').value;

            if(!date || !outTime) {
                alert('দয়া করে সঠিক সময় ও তারিখ দিন।');
                return;
            }

            const outDate = new Date(`1970-01-01T${outTime}:00`);
            const standardOutDate = new Date(`1970-01-01T17:00:00`);

            let otHours = 0;
            if (outDate > standardOutDate) {
                otHours = (outDate - standardOutDate) / (1000 * 60 * 60); 
            }

            if (editingId) {
                if (isFirebaseConnected) {
                    db.ref('otRecords/' + editingId).update({
                        date: date,
                        inTime: inTime,
                        outTime: outTime,
                        otHours: otHours
                    });
                } else {
                    const index = records.findIndex(r => r.id === editingId);
                    if (index !== -1) {
                        records[index] = { id: editingId, date, inTime, outTime, otHours };
                        saveLocalAndRender();
                    }
                }
                cancelEdit();
            } else {
                const recordId = Date.now().toString();
                const newRecord = {
                    id: recordId,
                    date: date,
                    inTime: inTime,
                    outTime: outTime,
                    otHours: otHours
                };

                if (isFirebaseConnected) {
                    db.ref('otRecords/' + recordId).set(newRecord);
                } else {
                    records.unshift(newRecord);
                    saveLocalAndRender();
                }
            }
        }

        function editRecord(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;

            document.getElementById('dateInput').value = item.date;
            document.getElementById('inTime').value = item.inTime;
            document.getElementById('outTime').value = item.outTime;

            editingId = id;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "হিসাব আপডেট করুন";
            submitBtn.style.background = "linear-gradient(to right, #43e97b, #38f9d7)";
            submitBtn.style.color = "#1a4d2e";

            document.getElementById('cancelBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('dateInput').valueAsDate = new Date();
            document.getElementById('inTime').value = "08:00";
            document.getElementById('outTime').value = "19:00";

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "হিসাব যোগ করুন";
            submitBtn.style.background = "linear-gradient(to right, #FF6A88, #FF9A9E)";
            submitBtn.style.color = "white";

            document.getElementById('cancelBtn').style.display = "none";
        }

        function saveLocalAndRender() {
            localStorage.setItem('otRecords', JSON.stringify(records));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('recordTable');
            tbody.innerHTML = '';
            let totalOT = 0;

            records.sort((a, b) => new Date(b.date) - new Date(a.date));

            records.forEach((item) => {
                totalOT += item.otHours;
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td>${formatTime(item.inTime)}</td>
                    <td>${formatTime(item.outTime)}</td>
                    <td class="ot-highlight">${item.otHours > 0 ? item.otHours.toFixed(2) + ' ঘণ্টা' : 'নাই'}</td>
                    <td><button class="edit-btn" onclick="editRecord('${item.id}')">✏️ এডিট</button></td>
                `;
            });

            document.getElementById('totalOtDisplay').innerText = totalOT.toFixed(2) + ' ঘণ্টা';
        }

        function exportToCSV() {
            if (records.length === 0) {
                alert("ডাউনলোড করার মতো কোনো ডাটা নেই!");
                return;
            }
            let csvContent = "\uFEFF";
            csvContent += "ওভারটাইম রিপোর্ট - Hashi Akter\n\n";
            csvContent += "তারিখ,ইন টাইম,আউট টাইম,ওভারটাইম (ঘণ্টা)\n";

            records.forEach(r => {
                csvContent += `"${r.date}","${formatTime(r.inTime)}","${formatTime(r.outTime)}","${r.otHours.toFixed(2)}"\n`;
            });

            let totalOT = records.reduce((sum, r) => sum + r.otHours, 0);
            csvContent += `\n"সর্বমোট ওভারটাইম","","","${totalOT.toFixed(2)} ঘণ্টা"\n`;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Overtime_Report_${new Date().toISOString().slice(0,7)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // নিখুঁত পিডিএফ ডাউনলোড ফাংশন (যা সরাসরি সাজানো PDF সেভ করবে)
        function downloadPDF() {
            if (records.length === 0) {
                alert("পিডিএফ তৈরি করার জন্য কোনো ডাটা নেই!");
                return;
            }

            const element = document.createElement('div');
            element.style.padding = '20px';
            element.style.fontFamily = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            element.style.color = '#333';

            let tableRows = '';
            let totalOT = 0;
            
            const sortedRecords = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedRecords.forEach(r => {
                totalOT += r.otHours;
                tableRows += `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px; text-align: center;">${r.date}</td>
                        <td style="padding: 10px; text-align: center;">${formatTime(r.inTime)}</td>
                        <td style="padding: 10px; text-align: center;">${formatTime(r.outTime)}</td>
                        <td style="padding: 10px; text-align: center; color: #FF6A88; font-weight: bold;">${r.otHours > 0 ? r.otHours.toFixed(2) + ' ঘণ্টা' : 'নাই'}</td>
                    </tr>
                `;
            });

            element.innerHTML = `
                <div style="text-align: center; margin-bottom: 25px; border-bottom: 3px solid #FF6A88; padding-bottom: 15px;">
                    <h2 style="color: #FF6A88; margin: 0 0 5px 0; font-size: 24px;">ওভারটাইম সামারি রিপোর্ট</h2>
                    <h3 style="margin: 0 0 5px 0; color: #333; font-size: 18px;">Hashi Akter</h3>
                    <p style="margin: 0; color: #666; font-size: 13px;">জেনারেল ডিউটি: সকাল ০৮:০০ - বিকেল ০৫:০০</p>
                </div>

                <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px;">
                    <thead>
                        <tr style="background-color: #FF6A88; color: white;">
                            <th style="padding: 10px; text-align: center;">তারিখ</th>
                            <th style="padding: 10px; text-align: center;">ইন টাইম</th>
                            <th style="padding: 10px; text-align: center;">আউট টাইম</th>
                            <th style="padding: 10px; text-align: center;">ওভারটাইম</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                <div style="background: #e6f4ea; border: 2px solid #34a853; padding: 15px; border-radius: 10px; text-align: right; font-size: 18px; font-weight: bold; color: #137333;">
                    সর্বমোট ওভারটাইম: ${totalOT.toFixed(2)} ঘণ্টা
                </div>
            `;

            const opt = {
                margin:       10,
                filename:     `Overtime_Report_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
