<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওভারটাইম ট্র্যাকার - Hashi Akter</title>
    <!-- Firebase SDK (ব্যাকগ্রাউন্ডে সিঙ্কের জন্য) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- html2pdf.js (ডাইরেক্ট PDF ডাউনলোডের জন্য) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 850px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .profile-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .profile-pic-wrapper {
            position: relative;
            display: inline-block;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FF6A88;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 106, 136, 0.3);
        }
        .profile-pic:hover {
            transform: scale(1.05);
        }
        .upload-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #FF6A88;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input[type="file"] {
            display: none;
        }
        .title {
            color: #333;
            font-size: 26px;
            margin-top: 12px;
            font-weight: bold;
        }
        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-box {
            flex: 1;
            min-width: 150px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.15);
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
        }
        input:focus {
            border-color: #FF6A88;
            box-shadow: 0 0 10px rgba(255, 106, 136, 0.3);
            background: #fff;
        }
        .btn-main {
            background: linear-gradient(to right, #FF6A88, #FF9A9E);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 106, 136, 0.4);
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 106, 136, 0.6);
        }
        .btn-cancel {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            display: none;
        }

        /* অ্যাকশন বাটনসমূহ (PDF ও প্রিন্ট) */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-action {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
            min-width: 160px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-pdf { background-color: #0284c7; }
        .btn-pdf:hover { background-color: #0369a1; transform: translateY(-2px); }
        .btn-print { background-color: #4b5563; }
        .btn-print:hover { background-color: #374151; transform: translateY(-2px); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background: #FF6A88;
            color: white;
            font-size: 15px;
        }
        tr:hover {
            background-color: #fafafa;
        }
        .ot-highlight {
            color: #FF6A88;
            font-weight: bold;
            font-size: 16px;
        }
        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }
        .edit-btn:hover {
            background: #d97706;
        }
        .total-box {
            margin-top: 20px;
            background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
            padding: 18px 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1a4d2e;
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* প্রিন্ট মিডিয়া স্টাইল */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; padding: 0; }
            .form-group, .btn-main, .btn-cancel, .action-buttons, .edit-btn, th:nth-child(5), td:nth-child(5) { display: none !important; }
            .upload-icon { display: none; }
            table { border: 1px solid #ccc; }
            th, td { border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- প্রোফাইল সেকশন -->
        <div class="profile-section">
            <div class="profile-pic-wrapper" onclick="document.getElementById('imageUpload').click()" title="ছবি পরিবর্তন করতে ক্লিক করুন">
                <img src="https://ui-avatars.com/api/?name=Hashi+Akter&background=FF6A88&color=fff&size=128" alt="Profile" class="profile-pic" id="profileImage">
                <div class="upload-icon">📷</div>
            </div>
            <input type="file" id="imageUpload" accept="image/*">
            <div class="title">ওভারটাইম হিসাব - Hashi Akter</div>
            <div class="subtitle">জেনারেল ডিউটি: সকাল ০৮:০০ - বিকেল ০৫:০০</div>
        </div>

        <!-- ইনপুট ফর্ম -->
        <div class="form-group">
            <div class="input-box">
                <label>তারিখ</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-box">
                <label>ইন টাইম</label>
                <input type="time" id="inTime" value="08:00">
            </div>
            <div class="input-box">
                <label>আউট টাইম</label>
                <input type="time" id="outTime" value="19:00">
            </div>
        </div>
        <button id="submitBtn" class="btn-main" onclick="handleSubmit()">হিসাব যোগ করুন</button>
        <button id="cancelBtn" class="btn-cancel" onclick="cancelEdit()">এডিট বাতিল করুন</button>

        <!-- অ্যাকশন বাটনসমূহ (PDF ও প্রিন্ট) -->
        <div class="action-buttons">
            <button class="btn-action btn-pdf" onclick="downloadPDF()">📄 PDF ডাউনলোড</button>
            <button class="btn-action btn-print" onclick="printReport()">🖨️ প্রিন্ট করুন</button>
        </div>

        <!-- টেবিল লিস্ট -->
        <table>
            <thead>
                <tr>
                    <th>তারিখ</th>
                    <th>ইন টাইম</th>
                    <th>আউট টাইম</th>
                    <th>ওভারটাইম</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="recordTable">
            </tbody>
        </table>

        <!-- সর্বমোট হিসাব -->
        <div class="total-box">
            <span>সর্বমোট ওভারটাইম:</span>
            <span id="totalOtDisplay">০.০০ ঘণ্টা</span>
        </div>
    </div>

    <script>
        // ১. ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyASqJ5Co85WqUrdXP50-oadtGLgR0mY3oc",
            authDomain: "overtime-tracker-9be53.firebaseapp.com",
            databaseURL: "https://overtime-tracker-9be53-default-rtdb.firebaseio.com",
            projectId: "overtime-tracker-9be53",
            storageBucket: "overtime-tracker-9be53.firebasestorage.app",
            messagingSenderId: "210681216694",
            appId: "1:210681216694:web:000518ae8d6c662e16b017"
        };

        let db = null;
        let isFirebaseConnected = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseConnected = true;
            }
        } catch (e) {
            console.log("Firebase Connection Status:", e);
        }

        let records = [];
        let editingId = null;

        // অটোমেটিক রিয়েল-টাইম কারেন্ট তারিখ সেট করা
        function setTodayDate() {
            const dateInput = document.getElementById('date') || document.getElementById('dateInput');
            if (dateInput) {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
            }
        }

        const profileImage = document.getElementById('profileImage');

        window.addEventListener('load', () => {
            setTodayDate();

            if (profileImage) {
                const savedImage = localStorage.getItem('userProfilePic');
                if (savedImage) profileImage.src = savedImage;
            }

            if (isFirebaseConnected) {
                db.ref('otRecords').on('value', (snapshot) => {
                    const data = snapshot.val();
                    records = data ? Object.values(data) : [];
                    renderTable();
                });
            } else {
                records = JSON.parse(localStorage.getItem('otRecords')) || [];
                renderTable();
            }
        });

        const imageUploadBtn = document.getElementById('imageUpload');
        if (imageUploadBtn) {
            imageUploadBtn.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        if (profileImage) profileImage.src = event.target.result;
                        localStorage.setItem('userProfilePic', event.target.result);
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        // ওভারটাইম গণনা
        function calculateOtHours(outTimeStr) {
            if (!outTimeStr) return 0;
            const parts = outTimeStr.split(':');
            if (parts.length < 2) return 0;
            let outH = parseInt(parts[0], 10);
            let outM = parseInt(parts[1], 10);
            
            let totalOutMinutes = outH * 60 + outM;
            let standardOutMinutes = 17 * 60; // বিকেল ৫:০০

            if (outH < 6) {
                totalOutMinutes += 24 * 60; 
            }

            if (totalOutMinutes > standardOutMinutes) {
                return (totalOutMinutes - standardOutMinutes) / 60;
            }
            return 0;
        }

        function formatTime(time) {
            if(!time) return "";
            let [h, m] = time.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }

        // হিসাব যোগ / আপডেট করার ফাংশন
        function handleSubmit() {
            const dateInput = document.getElementById('date') || document.getElementById('dateInput');
            const inTimeInput = document.getElementById('inTime');
            const outTimeInput = document.getElementById('outTime');

            const date = dateInput ? dateInput.value : '';
            const inTime = inTimeInput ? inTimeInput.value : '';
            const outTime = outTimeInput ? outTimeInput.value : '';

            if(!date || !outTime) {
                alert('দয়া করে সঠিক সময় ও তারিখ দিন।');
                return;
            }

            const otHours = calculateOtHours(outTime);

            if (editingId) {
                if (isFirebaseConnected) {
                    db.ref('otRecords/' + editingId).update({
                        date: date,
                        inTime: inTime,
                        outTime: outTime,
                        otHours: otHours
                    });
                } else {
                    const index = records.findIndex(r => r.id === editingId);
                    if (index !== -1) {
                        records[index] = { id: editingId, date, inTime, outTime, otHours };
                        saveLocalAndRender();
                    }
                }
                cancelEdit();
            } else {
                const recordId = Date.now().toString();
                const newRecord = {
                    id: recordId,
                    date: date,
                    inTime: inTime,
                    outTime: outTime,
                    otHours: otHours
                };

                if (isFirebaseConnected) {
                    db.ref('otRecords/' + recordId).set(newRecord);
                } else {
                    records.unshift(newRecord);
                    saveLocalAndRender();
                }
            }
        }

        function editRecord(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;

            const dateInput = document.getElementById('date') || document.getElementById('dateInput');
            if (dateInput) dateInput.value = item.date;
            if (document.getElementById('inTime')) document.getElementById('inTime').value = item.inTime;
            if (document.getElementById('outTime')) document.getElementById('outTime').value = item.outTime;

            editingId = id;

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerText = "হিসাব আপডেট করুন";
                submitBtn.style.background = "linear-gradient(to right, #43e97b, #38f9d7)";
                submitBtn.style.color = "#1a4d2e";
            }

            const cancelBtn = document.getElementById('cancelBtn');
            if (cancelBtn) cancelBtn.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            setTodayDate();
            if (document.getElementById('inTime')) document.getElementById('inTime').value = "08:00";
            if (document.getElementById('outTime')) document.getElementById('outTime').value = "19:00";

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerText = "হিসাব যোগ করুন";
                submitBtn.style.background = "linear-gradient(to right, #FF6A88, #FF9A9E)";
                submitBtn.style.color = "white";
            }

            const cancelBtn = document.getElementById('cancelBtn');
            if (cancelBtn) cancelBtn.style.display = "none";
        }

        function saveLocalAndRender() {
            localStorage.setItem('otRecords', JSON.stringify(records));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('recordTable');
            if (!tbody) return;
            tbody.innerHTML = '';
            let totalOT = 0;

            records.sort((a, b) => new Date(b.date) - new Date(a.date));

            records.forEach((item) => {
                let ot = calculateOtHours(item.outTime);
                item.otHours = ot;
                totalOT += ot;

                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td>${formatTime(item.inTime)}</td>
                    <td>${formatTime(item.outTime)}</td>
                    <td class="ot-highlight">${ot > 0 ? ot.toFixed(2) + ' ঘণ্টা' : 'নাই'}</td>
                    <td><button class="edit-btn" onclick="editRecord('${item.id}')">✏️ এডিট</button></td>
                `;
            });

            const totalOtDisplay = document.getElementById('totalOtDisplay');
            if (totalOtDisplay) totalOtDisplay.innerText = totalOT.toFixed(2) + ' ঘণ্টা';
        }
        
        // পিডিএফ ডাউনলোড (পিসি এবং মোবাইল দুই জায়গাতেই পারফেক্ট দেখাবে)
function downloadPDF() {
    if (records.length === 0) {
        alert("পিডিএফ তৈরি করার জন্য কোনো ডাটা নেই!");
        return;
    }

    const element = document.createElement('div');
    // পিসি এবং মোবাইলে যেন একই সাইজ থাকে তার জন্য A4 সাইজের ফিক্সড উইডথ দেওয়া হলো
    element.style.width = '794px'; 
    element.style.padding = '30px';
    element.style.boxSizing = 'border-box';
    element.style.fontFamily = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
    element.style.color = '#333';
    element.style.background = '#fff';

    let tableRows = '';
    let totalOT = 0;
    
    const sortedRecords = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));

    sortedRecords.forEach(r => {
        let ot = calculateOtHours(r.outTime);
        // যদি ot সঠিক সংখ্যা হয় তবেই যোগ হবে
        if (!isNaN(ot)) {
            totalOT += ot;
        }
        
        tableRows += `
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 12px; text-align: center; border: 1px solid #ddd;">${r.date}</td>
                <td style="padding: 12px; text-align: center; border: 1px solid #ddd;">${formatTime(r.inTime)}</td>
                <td style="padding: 12px; text-align: center; border: 1px solid #ddd;">${formatTime(r.outTime)}</td>
                <td style="padding: 12px; text-align: center; color: #FF6A88; font-weight: bold; border: 1px solid #ddd;">${ot > 0 ? ot.toFixed(2) + ' ঘণ্টা' : 'নাই'}</td>
            </tr>
        `;
    });

    element.innerHTML = `
        <div style="padding-bottom: 20px;">
            <div style="text-align: center; margin-bottom: 25px; border-bottom: 3px solid #FF6A88; padding-bottom: 15px;">
                <h2 style="color: #FF6A88; margin: 0 0 5px 0; font-size: 26px;">ওভারটাইম সামারি রিপোর্ট</h2>
                <h3 style="margin: 0 0 5px 0; color: #333; font-size: 20px;">Hashi Akter</h3>
                <p style="margin: 0; color: #666; font-size: 15px;">জেনারেল ডিউটি: সকাল ০৮:০০ - বিকেল ০৫:০০</p>
            </div>

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 16px;">
                <thead>
                    <tr style="background-color: #FF6A88; color: white;">
                        <th style="padding: 12px; text-align: center; border: 1px solid #ddd;">তারিখ</th>
                        <th style="padding: 12px; text-align: center; border: 1px solid #ddd;">ইন টাইম</th>
                        <th style="padding: 12px; text-align: center; border: 1px solid #ddd;">আউট টাইম</th>
                        <th style="padding: 12px; text-align: center; border: 1px solid #ddd;">ওভারটাইম</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>

            <!-- page-break-inside: avoid; দেওয়া হয়েছে যেন এটি মাঝখান থেকে না কাটে -->
            <div style="background: #e6f4ea; border: 2px solid #34a853; padding: 15px; border-radius: 10px; text-align: right; font-size: 20px; font-weight: bold; color: #137333; page-break-inside: avoid; display: block;">
                সর্বমোট ওভারটাইম: ${totalOT.toFixed(2)} ঘণ্টা
            </div>
        </div>
    `;

    const opt = {
        margin:       10,
        filename:     `Overtime_Report_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 1 },
        html2canvas:  { scale: 2, useCORS: true }, 
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['css', 'legacy'] } // এই অংশটি টোটাল বক্স কেটে যাওয়া বন্ধ করবে
    };

    html2pdf().set(opt).from(element).save();
}

function printReport() {
    window.print();
}
    </script>
</body>
</html>
